    function checkConditionDynamic(valThucTe, textDieuKien) {
        if (!textDieuKien || textDieuKien.trim() === "") return false;
        
        let subConditions = textDieuKien.split("||");
        let inputStr = valThucTe.toString().trim().toLowerCase();
        
        // Trích xuất số thông minh từ dữ liệu thực tế người dùng nhập
        let matchNumInput = valThucTe.toString().match(/(\d+([.,]\d+)?)/);
        let inputNum = matchNumInput ? parseFloat(matchNumInput[1].replace(',', '.')) : 0;

        for (let subCond of subConditions) {
            let cond = subCond.trim().toLowerCase();
            if (cond === "") continue;

            if (cond.startsWith(">=")) {
                let cleanCond = cond.substring(2).trim();
                let matchNumCond = cleanCond.match(/(\d+([.,]\d+)?)/);
                let condNum = matchNumCond ? parseFloat(matchNumCond[1].replace(',', '.')) : NaN;
                
                if (!isNaN(condNum)) {
                    if (inputNum >= condNum) return true;
                } else {
                    let hierarchy = ["trường", "cấp trường", "xã", "cấp xã", "cụm", "nhì cụm", "nhất xã", "tỉnh", "cấp tỉnh", "quốc gia"];
                    let idxInput = hierarchy.findIndex(h => inputStr.includes(h));
                    let idxCond = hierarchy.findIndex(h => cleanCond.includes(h));
                    if (idxInput >= idxCond && idxCond !== -1) return true;
                }
            } else {
                if (inputStr === cond || inputStr.includes(cond)) return true;
            }
        }
        return false;
    }

    function xuLyTinhToanDong(row, valThucTe, inputElement) {
        let diemCuaDong = 0;
        let xepLoaiCuaDong = "CHT"; 

        let rawThangGiaTri = row.getAttribute("data-thang-gia-tri") || "";
        let rawQuyDiem = row.getAttribute("data-quy-diem") || "";

        // 1. Nhận diện tính điểm thành phần chuẩn hóa từ Cột C
        if (rawThangGiaTri.includes("|")) {
            if (inputElement.tagName === "SELECT" && inputElement.selectedIndex !== -1) {
                diemCuaDong = parseFloat(inputElement.options[inputElement.selectedIndex].getAttribute("data-p")) || 0;
            }
        } else {
            let matchHeSo = rawQuyDiem.match(/([\+\-]?\d+)/);
            if (matchHeSo) {
                let heSoNhan = parseFloat(matchHeSo[1]) || 0;
                let giaTriNhap = parseFloat(valThucTe) || 0;
                diemCuaDong = giaTriNhap * heSoNhan;
            } else if (rawThangGiaTri === "THANHTICH_HS_DONG") {
                let m_d_1 = valThucTe.match(/=\s*([\d\.]+)\s*điểm/g);
                if (m_d_1) {
                    m_d_1.forEach(m => diemCuaDong += parseFloat(m.replace(/[^\d\.]/g, '')) || 0);
                }
            }
        }

        // 2. Kiểm tra điều kiện xếp loại tuần tự (Cascading Logic)
        let condXS = row.getAttribute("data-cond-xs") || "";
        let condHTT = row.getAttribute("data-cond-htt") || "";
        let condHT = row.getAttribute("data-cond-ht") || "";

        if (checkConditionDynamic(valThucTe, condXS)) {
            xepLoaiCuaDong = "XS";
        } else if (checkConditionDynamic(valThucTe, condHTT)) {
            xepLoaiCuaDong = "HTT";
        } else if (checkConditionDynamic(valThucTe, condHT)) {
            xepLoaiCuaDong = "HT";
        }

        return { diem: diemCuaDong, xepLoai: xepLoaiCuaDong };
    }

    function f_x_l_chinh(mangDuLieuGom) {
        let diemP1 = 0;
        let diemP2 = 0;
        let totalCriteriaCount = 0;
        let xsCount = 0, httCount = 0, htCount = 0, chtCount = 0;
        
        let currentSection = "Phần 1";
        const rows = document.querySelectorAll("#t-b-g tr");

        rows.forEach(row => {
            if (row.getAttribute("data-loai-dong") === "phan") {
                let textPhan = row.querySelector(".m-cot-mot").innerText;
                if (textPhan.toUpperCase().includes("PHẦN 2")) currentSection = "Phần 2";
                return;
            }

            let inputElement = row.querySelector(".o-n-bang");
            if (!inputElement) return;

            totalCriteriaCount++;
            let valThucTe = inputElement.value.trim();
            let res = xuLyTinhToanDong(row, valThucTe, inputElement);

            if (currentSection === "Phần 1") diemP1 += res.diem;
            else diemP2 += res.diem;

            if (res.xepLoai === "XS") xsCount++;
            else if (res.xepLoai === "HTT") httCount++;
            else if (res.xepLoai === "HT") htCount++;
            else chtCount++;
        });

        let tongDiem = diemP1 + diemP2;
        let k_t = "CHƯA HOÀN THÀNH NHIỆM VỤ";
        let k_m = "#dc3545";

        if (chtCount === 0 && (xsCount >= totalCriteriaCount * 0.5)) {
            k_t = "HOÀN THÀNH XUẤT SẮC NHIỆM VỤ"; k_m = "#28a745";
        } else if (chtCount === 0 && ((xsCount + httCount) >= totalCriteriaCount * 0.7)) {
            k_t = "HOÀN THÀNH TỐT NHIỆM VỤ"; k_m = "#0056b3";
        } else if (chtCount <= totalCriteriaCount * 0.2) {
            k_t = "HOÀN THÀNH NHIỆM VỤ"; k_m = "#ffc107";
        }

        return { diemP1, diemP2, tongDiem, k_t, k_m };
    }

        } else if (chtCount === 0 && ((xsCount + httCount) >= totalCriteriaCount * 0.7)) {
            k_t = "HOÀN THÀNH TỐT NHIỆM VỤ"; k_m = "#0056b3";
        } else if (chtCount <= totalCriteriaCount * 0.2) {

    function f_x_h() {
        const rows = document.querySelectorAll("#t-b-g tr");
        const c_n = document.getElementById("oChonNhom").value;
        let mangDuLieuGom = [];
        
        rows.forEach(row => {
            let c_x_1 = row.querySelector(".m-cot-mot");
            let c_x_2 = row.querySelector(".o-n-bang");
            if (c_x_1 && c_x_2) {
                let e_s = row.querySelector("select.o-n-bang");
                mangDuLieuGom.push({
                    ten: c_x_1.innerText.toLowerCase(),
                    giaTri: c_x_2.value.toLowerCase(),
                    isSelect: e_s !== null
                });
            }
        });

        let k_q = { diemP1: 0, diemP2: 0, tongDiem: 0, k_t: "CHƯA HOÀN THÀNH NHIỆM VỤ", k_m: "#dc3545" };

        if (c_n === "giaovien") {
            k_q = f_x_l_chinh(mangDuLieuGom);
        } else if (c_n === "nhanvien") {
            k_q = f_x_m_chinh(mangDuLieuGom);
        }

        v_l_e = k_q.k_t;
        v_l_f = k_q.tongDiem;

        document.getElementById("vHT1").innerText = `Tổng điểm phần 1: ${k_q.diemP1}`;
        document.getElementById("vHT2").innerText = `Tổng điểm phần 2: ${k_q.diemP2}`;
        document.getElementById("vHT3").innerHTML = `
            <div style="font-size: 20px; font-weight: bold; color: ${k_q.k_m}; text-transform: uppercase; white-space: nowrap;">${k_q.k_t}</div>
            <div style="font-size: 18px; color: #b30000; font-weight: bold; margin-top: 5px;">Tổng điểm năm học: ${k_q.tongDiem}</div>
        `;
    }

    async function f_x_xuat_pdf() {
        try {
            const element = document.getElementById("vungThuHai");
            if (!element) {
                alert("Không tìm thấy vùng dữ liệu đánh giá.");
                return;
            }

            let tenNV = "VienChuc";
            const eTen = document.getElementById("theHienChinh");
            if (eTen) { tenNV = eTen.innerText.trim(); }
            
            const namHoc = (typeof v_nam_hoc_hien_tai !== 'undefined' && v_nam_hoc_hien_tai) ? v_nam_hoc_hien_tai : "2025-2026";
            const tenFile = `KetQuaDanhGia_${tenNV.replace(/\s+/g, "_")}_${namHoc}.pdf`;

            if (typeof hienThiThongBaoUI === "function") {
                hienThiThongBaoUI("Hệ thống đang tự động căn chỉnh, chèn Logo và xuất PDF...<br>Vui lòng không cuộn chuột.");
            }

            const oldWidth = element.style.width;
            const oldOverflow = element.style.overflow;
            const oldMaxWidth = element.style.maxWidth;
            const oldPadding = element.style.padding;
            const oldBoxSizing = element.style.boxSizing;
            const vungNut = document.getElementById("vungNutBam");

            const cellStates = [];
            const tables = element.querySelectorAll("table");
            tables.forEach(tb => {
                const cells = tb.querySelectorAll("th, td, tr");
                cells.forEach(c => {
                    cellStates.push({
                        el: c,
                        padding: c.style.padding,
                        fontSize: c.style.fontSize,
                        lineHeight: c.style.lineHeight,
                        wordBreak: c.style.wordBreak,
                        whiteSpace: c.style.whiteSpace,
                        border: c.style.border,
                        fontWeight: c.style.fontWeight, 
                        boxSizing: c.style.boxSizing,
                        pageBreakInside: c.style.pageBreakInside,
                        breakInside: c.style.breakInside
                    });
                });
            });

            const tieuDePDF = document.createElement("div");
            tieuDePDF.id = "tieu-de-pdf-tam";
            tieuDePDF.style.marginBottom = "15px"; 
            tieuDePDF.style.fontFamily = "'Times New Roman', serif";
            tieuDePDF.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px;">
                    <div style="font-weight: bold; font-size: 12pt; text-transform: uppercase; text-align: left; padding-top: 5px;">${typeof DG_TEN_TRUONG_UP !== 'undefined' ? DG_TEN_TRUONG_UP : 'TRƯỜNG'}</div>
                    <img src="${typeof DG_LINK_LOGO !== 'undefined' ? DG_LINK_LOGO : ''}" style="width: 55px; height: auto;">
                </div>
                <div style="text-align: center;">
                    <h2 style="margin: 0 0 8px 0; font-size: 14pt; font-weight: bold; color: #000; text-transform: uppercase;">KẾT QUẢ ĐÁNH GIÁ XẾP LOẠI VIÊN CHỨC</h2>
                    <div style="font-size: 12pt; color: #000;">Họ tên: <b style="text-transform: uppercase;">${tenNV}</b> - Năm học: <b>${namHoc}</b></div>
                </div>
            `;
            element.prepend(tieuDePDF);

            const logoImg = tieuDePDF.querySelector('img');
            if (logoImg) {
                await new Promise((resolve) => {
                    if (logoImg.complete) resolve();
                    else { logoImg.onload = resolve; logoImg.onerror = resolve; }
                });
            }

            if (vungNut) vungNut.style.display = "none";
            element.style.width = "190mm";
            element.style.maxWidth = "190mm";
            element.style.overflow = "visible";
            element.style.padding = "0 2mm"; 
            element.style.boxSizing = "border-box";

            tables.forEach(tb => {
                tb.style.width = "100%"; 
                tb.style.margin = "0"; 
                tb.style.tableLayout = "fixed";
                tb.style.borderCollapse = "collapse";
                tb.style.border = "0.1pt solid #999"; 
                
                const rows = tb.querySelectorAll("tr");
                rows.forEach(r => {
                    r.style.pageBreakInside = "avoid";
                    r.style.breakInside = "avoid";
                    r.style.border = "0.1pt solid #999"; 
                });

                cells.forEach(c => {
                    c.style.wordBreak = "break-word";
                    c.style.whiteSpace = "pre-wrap";
                    c.style.border = "0.1pt solid #999"; 
                    c.style.color = "#000";
                    c.style.boxSizing = "border-box"; 
                    
                    c.style.fontSize = "10pt"; 
                    if(c.tagName === 'TD') {
                        c.style.fontWeight = "normal";
                    }
                    
                    c.style.padding = "6px 5px"; 
                    c.style.lineHeight = "1.5";
                });
                
                const firstRow = tb.querySelector("tr");
                if (firstRow && firstRow.children.length >= 4) {
                    firstRow.children[0].style.width = "5%";
                    firstRow.children[1].style.width = "35%";
                    firstRow.children[2].style.width = "15%";
                    firstRow.children[3].style.width = "45%";
                }
            });

            const summaryBlock = element.querySelector(".v-t-k");
            let summaryOldCSS = "";
            if (summaryBlock) {
                summaryOldCSS = summaryBlock.style.cssText;
                summaryBlock.style.marginTop = "15px";
                summaryBlock.style.padding = "10px 15px";
                summaryBlock.style.border = "0.1pt solid #999"; 
                summaryBlock.style.backgroundColor = "#f0f0f0";
                summaryBlock.style.display = "flex";
                summaryBlock.style.justifyContent = "space-between";
                summaryBlock.style.alignItems = "center";
                summaryBlock.style.pageBreakInside = "avoid";
                summaryBlock.style.breakInside = "avoid"; 

                const titleDukien = summaryBlock.querySelector("h3");
                if (titleDukien) titleDukien.style.fontSize = "11pt"; 

                const leftScores = summaryBlock.querySelector("div:nth-child(2)");

                        totalScoreText.style.fontWeight = "bold";

            await new Promise(resolve => setTimeout(resolve, 300)); 

            let pageWidth = element.getBoundingClientRect().width; 
            let pageHeight = pageWidth * 1.405; 
            let totalHeight = element.scrollHeight;
            let pages = Math.ceil(totalHeight / pageHeight);
            let overflow = totalHeight % pageHeight;

            if (pages > 1 && overflow > 0) {
                if (overflow < pageHeight * 0.15) {
                    tables.forEach(tb => {
                        const cells = tb.querySelectorAll("th, td");
                        cells.forEach(c => {
                            c.style.padding = "4px 3px";
                            c.style.fontSize = "9.5pt"; 
                            c.style.lineHeight = "1.3";
                        });
                    });
                } 
                else if (overflow > pageHeight * 0.4 && overflow < pageHeight * 0.85) {
                    tables.forEach(tb => {
                        const cells = tb.querySelectorAll("th, td");
                        cells.forEach(c => {
                            c.style.padding = "9px 5px";
                            c.style.lineHeight = "1.6";
                        });
                    });
                }
            } else if (pages === 1 && totalHeight < pageHeight * 0.85) {
                tables.forEach(tb => {
                    const cells = tb.querySelectorAll("th, td");
                    cells.forEach(c => {
                        c.style.padding = "10px 5px";
                        c.style.lineHeight = "1.7";
                    });
                });
            }

            await new Promise(resolve => setTimeout(resolve, 300)); 

            const opt = {
                margin: [15, 10, 15, 10], 
                filename: tenFile,
                image: { type: "jpeg", quality: 1 },
                html2canvas: {
                    scale: 2,
                    useCORS: true, 
                    logging: false,
                    scrollX: 0,
                    scrollY: 0
                },
                jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
                pagebreak: { mode: ['css', 'legacy'] } 
            };

            const worker = html2pdf().set(opt).from(element);
            await worker.toPdf().get('pdf').then(function(pdf) {
                const totalPages = pdf.internal.getNumberOfPages();
                for (let i = 1; i <= totalPages; i++) {
                    pdf.setPage(i);
                    pdf.setDrawColor(153, 153, 153); 
                    pdf.setLineWidth(0.1); 
                    if (i > 1) { pdf.line(10, 15, 200, 15); }
                    if (i < totalPages) { pdf.line(10, 282, 200, 282); }
                }
            });
            await worker.save(); 

            element.removeChild(tieuDePDF);
            element.style.width = oldWidth;
            element.style.maxWidth = oldMaxWidth;
            element.style.overflow = oldOverflow;
            element.style.padding = oldPadding;
            element.style.boxSizing = oldBoxSizing;
            
            cellStates.forEach(state => {
                state.el.style.padding = state.padding;
                state.el.style.fontSize = state.fontSize;
                state.el.style.lineHeight = state.lineHeight;
                state.el.style.wordBreak = state.wordBreak;
                state.el.style.whiteSpace = state.whiteSpace;
                state.el.style.border = state.border;
                state.el.style.fontWeight = state.fontWeight; 
                state.el.style.boxSizing = state.boxSizing;
                state.el.style.pageBreakInside = state.pageBreakInside;
                state.el.style.breakInside = state.breakInside;
            });

            if (summaryBlock) {
                summaryBlock.style.cssText = summaryOldCSS; 
            }

            if (vungNut) vungNut.style.display = "flex";
            if (typeof dongCanhBaoUI === "function") { dongCanhBaoUI(); }

        } catch (err) {
            console.error("Lỗi xuất PDF:", err);
            alert("Có lỗi xảy ra trong quá trình tạo file PDF. Thầy vui lòng thử lại.\nChi tiết mã lỗi: " + err.message);
            if (typeof dongCanhBaoUI === "function") { dongCanhBaoUI(); }
        }
    }
</script>
