<script>
function f_x_m_chinh(dataRows) {
    let diemP1 = 0, diemP2 = 0;
    let diemThangGoc = 0;
    let isXSThang = false, isTotThang = false, isHTThang = false, isCHTThang = false;

    // BƯỚC 1: ĐỘNG CƠ TÍNH ĐIỂM DỰA VÀO CỘT C
    dataRows.forEach(r => {
        let v_str = r.giaTri;
        let v_num = r.so;

        if (r.isSelect) diemP2 += r.selectDataP;

        if (r.q_d) {
            let qd = r.q_d.replace(/\s/g, '');
            if (qd.startsWith('(+') || qd.startsWith('(-')) {
                let heSo = parseFloat(qd.match(/[\+\-]\d+(\.\d+)?/)[0]);
                diemP2 += (v_num * heSo);
            }
        }

        if (r.isDongBo || r.ten.includes("tháng")) {
            diemThangGoc = v_num;
            if (v_str.includes("xuất sắc")) { isXSThang = true; isHTThang = true; diemP1 = 100 + diemThangGoc; }
            else if (v_str.includes("tốt")) { isTotThang = true; isHTThang = true; diemP1 = 80 + diemThangGoc; }
            else if (v_str.includes("chưa hoàn thành") || v_str.includes("cht")) { isCHTThang = true; diemP1 = 0 + diemThangGoc; }
            else if (v_str.includes("hoàn thành") || v_str.includes("ht")) { isHTThang = true; diemP1 = 60 + diemThangGoc; }
            else { diemP1 = diemThangGoc; }
        }
    });

    // BƯỚC 2: ĐỘNG CƠ THẨM ĐỊNH LOGIC (D, E, F, G)
    let datXS = true, datTot = true, datHT = true;

    const evalCondition = (cond, valNum, valStr, row) => {
        cond = cond.trim().toLowerCase();
        if (cond === "" || cond === "any") return true;

        let isNumericCond = cond.match(/^[><=]+[\d\.]+$/);
        if (isNumericCond) {
            if (cond.startsWith(">=")) return valNum >= parseFloat(cond.replace(">=", ""));
            if (cond.startsWith("<=")) return valNum <= parseFloat(cond.replace("<=", ""));
            if (cond.startsWith(">")) return valNum > parseFloat(cond.replace(">", ""));
            if (cond.startsWith("<")) return valNum < parseFloat(cond.replace("<", ""));
            if (cond.startsWith("==")) return valNum === parseFloat(cond.replace("==", ""));
        }
        if (cond.match(/^[\d\.]+$/)) return valNum === parseFloat(cond); 

        if (cond.startsWith(">=") && isNaN(cond.replace(">=", ""))) {
            let hierarchy = [
                ["yếu", "kém", "chưa đạt", "không có", "chưa hoàn thành"],
                ["trung bình", "cấp trường", "hoàn thành"],
                ["khá", "cấp xã", "cấp cụm", "hoàn thành tốt"],
                ["tốt", "giỏi", "cấp tỉnh", "cấp huyện", "xuất sắc"],
                ["cấp quốc gia"]
            ];
            let targetText = cond.replace(">=", "").trim();
            let targetLevel = -1, currentLevel = -1;

            hierarchy.forEach((arr, idx) => { if(arr.some(w => targetText.includes(w))) targetLevel = idx; });
            hierarchy.forEach((arr, idx) => { if(arr.some(w => valStr.includes(w))) currentLevel = idx; });

            if (targetLevel !== -1 && currentLevel !== -1) return currentLevel >= targetLevel;
        }

        return valStr.includes(cond);
    };

    const evalCell = (cellFormula, valNum, valStr, row) => {
        if (!cellFormula) return true; 
        let parts = cellFormula.split("||");
        for (let i = 0; i < parts.length; i++) {
            let p = parts[i].trim().toLowerCase();

            if (row.ten.includes("kết quả xếp loại hàng tháng")) {
                if (p === "xuất sắc" && isXSThang) return true;
                if (p === "hoàn thành tốt" && isTotThang) return true;
                if (p === "hoàn thành" && isHTThang) return true;
                if (p.includes(">") && diemThangGoc > parseFloat(p.replace(">",""))) return true;
            } else {
                if (evalCondition(p, valNum, valStr, row)) return true; 
            }
        }
        return false;
    };

    dataRows.forEach(r => {
        if (r.ten === "" || r.ten.includes("phần 1") || r.ten.includes("phần 2")) return; 

        if (r.g_xs && !evalCell(r.g_xs, r.so, r.giaTri, r)) datXS = false;
        if (r.g_htt && !evalCell(r.g_htt, r.so, r.giaTri, r)) datTot = false;
        if (r.g_ht && !evalCell(r.g_ht, r.so, r.giaTri, r)) datHT = false;
    });

    if (isCHTThang) { datXS = false; datTot = false; datHT = false; }

    // BƯỚC 3: KẾT LUẬN & ĐÓNG GÓI
    let k_t = "CHƯA HOÀN THÀNH NHIỆM VỤ";
    let k_m = "#dc3545";

    if (datXS) { k_t = "HOÀN THÀNH XUẤT SẮC NHIỆM VỤ"; k_m = "#28a745"; }
    else if (datTot) { k_t = "HOÀN THÀNH TỐT NHIỆM VỤ"; k_m = "#007bff"; }
    else if (datHT) { k_t = "HOÀN THÀNH NHIỆM VỤ"; k_m = "#fd7e14"; }

    let k_t_t = diemP1 + diemP2;

    return {
        diemP1: diemP1 % 1 === 0 ? diemP1 : diemP1.toFixed(1),
        diemP2: diemP2 % 1 === 0 ? diemP2 : diemP2.toFixed(1),
        tongDiem: k_t_t % 1 === 0 ? k_t_t : k_t_t.toFixed(1),
        k_t: k_t,
        k_m: k_m
    };
}
</script>
