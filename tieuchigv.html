<script>
// =========================================================
// KHỐI THUẬT TOÁN ĐÁNH GIÁ DÀNH RIÊNG CHO GIÁO VIÊN
// Cơ chế: Ánh xạ động, quét điều kiện thời gian thực
// =========================================================
function f_x_f_gv(idx) {
    const v_c = document.getElementById(`h_c_${idx}`).value;
    const v_s = parseInt(document.getElementById(`h_g_${idx}`).value);
    const v_h = parseFloat(document.getElementById(`h_l_${idx}`).value);
    const v_l = parseInt(document.getElementById(`h_s_${idx}`).value) || 1;
    
    const m_c = { 'QUOCGIA': [18, 16, 14, 12], 'TINH': [12, 10, 8, 6], 'XA': [6, 4, 2, 1] };
    
    let m_g = (typeof v_l_c !== 'undefined' && v_l_c[`DIEM_HS_${v_c}`]) 
                ? (v_l_c[`DIEM_HS_${v_c}`].split(',').length >= 4 ? v_l_c[`DIEM_HS_${v_c}`].split(',') : m_c[v_c]) 
                : m_c[v_c];
                
    let d_1 = parseFloat(m_g[v_s].toString().trim()) * v_h;
    let d_t = d_1 * v_l;
    
    let c_t = document.getElementById(`h_c_${idx}`).options[document.getElementById(`h_c_${idx}`).selectedIndex].text;
    let c_g = document.getElementById(`h_g_${idx}`).options[document.getElementById(`h_g_${idx}`).selectedIndex].text;
    
    let c_d = `+ ${v_l} HS đạt ${c_g} ${c_t} (${v_h > 1 ? 'Tập thể' : 'Cá nhân'}: ${d_1}đ/giải) = ${d_t} điểm\n`;
    let c_a = document.getElementById(`h_a_${idx}`);
    
    c_a.value = (c_a.value.includes("...") ? "" : c_a.value) + c_d;
    document.getElementById(`h_t_${idx}`).innerHTML = c_a.value.replace(/\n/g, '<br>');
    
    if(typeof f_x_h === 'function') f_x_h();
}

function f_x_g_gv(idx) { 
    document.getElementById(`h_a_${idx}`).value = ""; 
    document.getElementById(`h_t_${idx}`).innerHTML = "..."; 
    if(typeof f_x_h === 'function') f_x_h(); 
}

function checkConditionDynamic_GV(valThucTe, textDieuKien) {
    if (!textDieuKien || textDieuKien.trim() === "") return false;
    
    let subConditions = textDieuKien.split("||");
    let inputStr = valThucTe.toString().trim().toLowerCase();
    
    let matchNumInput = valThucTe.toString().match(/(\d+([.,]\d+)?)/);
    let inputNum = matchNumInput ? parseFloat(matchNumInput[1].replace(',', '.')) : 0;

    for (let subCond of subConditions) {
        let cond = subCond.trim().toLowerCase();
        if (cond === "") continue;

        if (cond.startsWith(">=")) {
            let cleanCond = cond.substring(2).trim();
            let matchNumCond = cleanCond.match(/(\d+([.,]\d+)?)/);
            let condNum = matchNumCond ? parseFloat(matchNumCond[1].replace(',', '.')) : NaN;
            
            if (!isNaN(condNum)) {
                if (inputNum >= condNum) return true;
            } else {
                let hierarchy = ["trường", "cấp trường", "xã", "cấp xã", "cụm", "nhì cụm", "nhất xã", "tỉnh", "cấp tỉnh", "quốc gia"];
                let idxInput = hierarchy.findIndex(h => inputStr.includes(h));
                let idxCond = hierarchy.findIndex(h => cleanCond.includes(h));
                if (idxInput >= idxCond && idxCond !== -1) return true;
            }
        } else {
            if (inputStr === cond || inputStr.includes(cond)) return true;
        }
    }
    return false;
}

function xuLyTinhToanDong_GV(row, valThucTe, inputElement) {
    let diemCuaDong = 0;
    let xepLoaiCuaDong = "CHT"; 

    let rawThangGiaTri = row.getAttribute("data-thang-gia-tri") || "";
    let rawQuyDiem = row.getAttribute("data-quy-diem") || "";

    if (rawThangGiaTri.includes("|")) {
        if (inputElement.tagName === "SELECT" && inputElement.selectedIndex !== -1) {
            diemCuaDong = parseFloat(inputElement.options[inputElement.selectedIndex].getAttribute("data-p")) || 0;
        }
    } else {
        let matchHeSo = rawQuyDiem.match(/([\+\-]?\d+)/);
        if (matchHeSo) {
            let heSoNhan = parseFloat(matchHeSo[1]) || 0;
            let giaTriNhap = parseFloat(valThucTe) || 0;
            diemCuaDong = giaTriNhap * heSoNhan;
        } else if (rawThangGiaTri === "THANHTICH_HS_DONG") {
            let m_d_1 = valThucTe.match(/=\s*([\d\.]+)\s*điểm/g);
            if (m_d_1) {
                m_d_1.forEach(m => diemCuaDong += parseFloat(m.replace(/[^\d\.]/g, '')) || 0);
            }
        }
    }

    let condXS = row.getAttribute("data-cond-xs") || "";
    let condHTT = row.getAttribute("data-cond-htt") || "";
    let condHT = row.getAttribute("data-cond-ht") || "";

    if (checkConditionDynamic_GV(valThucTe, condXS)) {
        xepLoaiCuaDong = "XS";
    } else if (checkConditionDynamic_GV(valThucTe, condHTT)) {
        xepLoaiCuaDong = "HTT";
    } else if (checkConditionDynamic_GV(valThucTe, condHT)) {
        xepLoaiCuaDong = "HT";
    }

    return { diem: diemCuaDong, xepLoai: xepLoaiCuaDong };
}

function f_x_l_chinh() {
    let diemP1 = 0;
    let diemP2 = 0;
    let totalCriteriaCount = 0;
    let xsCount = 0, httCount = 0, htCount = 0, chtCount = 0;
    
    let currentSection = "Phần 1";
    const rows = document.querySelectorAll("#t-b-g tr");

    rows.forEach(row => {
        if (row.getAttribute("data-loai-dong") === "phan") {
            let textPhan = row.querySelector(".m-cot-mot").innerText;
            if (textPhan.toUpperCase().includes("PHẦN 2")) currentSection = "Phần 2";
            return;
        }

        let inputElement = row.querySelector(".o-n-bang");
        if (!inputElement) return;

        totalCriteriaCount++;
        let valThucTe = inputElement.value.trim();
        let res = xuLyTinhToanDong_GV(row, valThucTe, inputElement);

        if (currentSection === "Phần 1") diemP1 += res.diem;
        else diemP2 += res.diem;

        if (res.xepLoai === "XS") xsCount++;
        else if (res.xepLoai === "HTT") httCount++;
        else if (res.xepLoai === "HT") htCount++;
        else chtCount++;
    });

    let tongDiem = diemP1 + diemP2;
    let k_t = "CHƯA HOÀN THÀNH NHIỆM VỤ";
    let k_m = "#dc3545";

    if (chtCount === 0 && (xsCount >= totalCriteriaCount * 0.5)) {
        k_t = "HOÀN THÀNH XUẤT SẮC NHIỆM VỤ"; k_m = "#28a745";
    } else if (chtCount === 0 && ((xsCount + httCount) >= totalCriteriaCount * 0.7)) {
        k_t = "HOÀN THÀNH TỐT NHIỆM VỤ"; k_m = "#0056b3";
    } else if (chtCount <= totalCriteriaCount * 0.2) {
        k_t = "HOÀN THÀNH NHIỆM VỤ"; k_m = "#ffc107";
    }

    return { diemP1, diemP2, tongDiem, k_t, k_m };
}
</script>
