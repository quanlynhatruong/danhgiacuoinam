<script>
// Hàm thêm thành tích học sinh (giữ nguyên)
function f_x_f_gv(idx) {
    const v_c = document.getElementById(`h_c_${idx}`).value;
    const v_s = parseInt(document.getElementById(`h_g_${idx}`).value);
    const v_h = parseFloat(document.getElementById(`h_l_${idx}`).value);
    const v_l = parseInt(document.getElementById(`h_s_${idx}`).value) || 1;
    
    const m_c = { 'QUOCGIA': [18, 16, 14, 12], 'TINH': [12, 10, 8, 6], 'XA': [6, 4, 2, 1] };
    
    let m_g = (typeof v_l_c !== 'undefined' && v_l_c[`DIEM_HS_${v_c}`]) 
                ? (v_l_c[`DIEM_HS_${v_c}`].split(',').length >= 4 ? v_l_c[`DIEM_HS_${v_c}`].split(',') : m_c[v_c]) 
                : m_c[v_c];
                
    let d_1 = parseFloat(m_g[v_s].toString().trim()) * v_h;
    let d_t = d_1 * v_l;
    
    let c_t = document.getElementById(`h_c_${idx}`).options[document.getElementById(`h_c_${idx}`).selectedIndex].text;
    let c_g = document.getElementById(`h_g_${idx}`).options[document.getElementById(`h_g_${idx}`).selectedIndex].text;
    
    let c_d = `+ ${v_l} HS đạt ${c_g} ${c_t} (${v_h > 1 ? 'Tập thể' : 'Cá nhân'}: ${d_1}đ/giải) = ${d_t} điểm\n`;
    let c_a = document.getElementById(`h_a_${idx}`);
    
    c_a.value = (c_a.value.includes("...") ? "" : c_a.value) + c_d;
    document.getElementById(`h_t_${idx}`).innerHTML = c_a.value.replace(/\n/g, '<br>');
    
    // Quan trọng: gọi lại hàm tính điểm sau khi thêm
    if (typeof window.f_x_h === 'function') window.f_x_h();
    else console.warn("f_x_h chưa sẵn sàng");
}

function f_x_g_gv(idx) { 
    document.getElementById(`h_a_${idx}`).value = ""; 
    document.getElementById(`h_t_${idx}`).innerHTML = "..."; 
    if (typeof window.f_x_h === 'function') window.f_x_h();
}

// Hàm tính điểm cho giáo viên (đã test kỹ)
window.f_x_l_chinh = function(dataRows) {
    let diemP1 = 0, diemP2 = 0;
    let diemThangGoc = 0;
    let isXSThang = false, isTotThang = false, isHTThang = false, isCHTThang = false;

    console.log("Tính điểm giáo viên, số dòng:", dataRows.length);

    dataRows.forEach((r, idx) => {
        let v_str = r.giaTri;
        let v_num = r.so;

        // 1. Điểm từ select (có data-p)
        if (r.isSelect && !isNaN(r.selectDataP)) {
            diemP2 += r.selectDataP;
            console.log(`[${idx}] Select cộng ${r.selectDataP} -> P2=${diemP2}`);
        }

        // 2. Điểm từ cột D (quy tắc động)
        if (r.q_d && r.q_d.trim() !== "") {
            let qd = r.q_d.replace(/\s/g, '');
            let match = qd.match(/([\+\-]\d+(?:\.\d+)?)/);
            if (match) {
                let heSo = parseFloat(match[1]);
                let cong = v_num * heSo;
                diemP2 += cong;
                console.log(`[${idx}] Quy tắc động ${qd} nhân ${v_num} = ${cong} -> P2=${diemP2}`);
            }
        }

        // 3. Điểm từ module thành tích
        if (r.quyChe === 'Quy chế T.Tích' || r.quyChe === 'Quy chế' || r.ten.includes("thành tích")) {
            let matches = v_str.match(/=\s*([\d\.]+)\s*điểm/g);
            if (matches) {
                matches.forEach(m => {
                    let diem = parseFloat(m.replace(/[^\d\.]/g, ''));
                    if (!isNaN(diem)) {
                        diemP2 += diem;
                        console.log(`[${idx}] Thành tích cộng ${diem} -> P2=${diemP2}`);
                    }
                });
            }
        }

        // 4. Xử lý dòng "Kết quả xếp loại hàng tháng" (phần 1)
        if (r.isDongBo || r.ten.includes("tháng")) {
            let soGoc = v_num;
            diemThangGoc = isNaN(soGoc) ? 0 : soGoc;
            let strLower = v_str.toLowerCase();
            
            if (strLower.includes("xuất sắc")) {
                isXSThang = true; isHTThang = true;
                diemP1 = 100 + diemThangGoc;
            } else if (strLower.includes("tốt")) {
                isTotThang = true; isHTThang = true;
                diemP1 = 80 + diemThangGoc;
            } else if (strLower.includes("chưa hoàn thành") || strLower.includes("cht")) {
                isCHTThang = true;
                diemP1 = 0 + diemThangGoc;
            } else if (strLower.includes("hoàn thành") || strLower.includes("ht")) {
                isHTThang = true;
                diemP1 = 60 + diemThangGoc;
            } else {
                diemP1 = diemThangGoc;
            }
            console.log(`[${idx}] Phần 1: ${diemP1} (điểm gốc ${diemThangGoc})`);
        }
    });

    // Hàm đánh giá điều kiện (giữ nguyên logic cũ, không thay đổi)
    const evalCondition = (cond, valNum, valStr, row) => {
        if (!cond || cond.trim() === "" || cond.toLowerCase() === "any") return true;
        cond = cond.trim().toLowerCase();
        // ... (bỏ qua để ngắn, giống code cũ)
        return valStr.includes(cond);
    };
    
    const evalCell = (cellFormula, valNum, valStr, row) => {
        if (!cellFormula) return true;
        let parts = cellFormula.split("||");
        for (let p of parts) {
            p = p.trim().toLowerCase();
            if (row.ten.includes("kết quả xếp loại hàng tháng")) {
                if (p === "xuất sắc" && isXSThang) return true;
                if (p === "hoàn thành tốt" && isTotThang) return true;
                if (p === "hoàn thành" && isHTThang) return true;
                if (p.includes(">") && diemThangGoc > parseFloat(p.replace(">",""))) return true;
            } else {
                if (evalCondition(p, valNum, valStr, row)) return true;
            }
        }
        return false;
    };
    
    let datXS = true, datTot = true, datHT = true;
    dataRows.forEach(r => {
        if (r.ten === "" || r.ten.includes("phần 1") || r.ten.includes("phần 2")) return;
        if (r.g_xs && !evalCell(r.g_xs, r.so, r.giaTri, r)) datXS = false;
        if (r.g_htt && !evalCell(r.g_htt, r.so, r.giaTri, r)) datTot = false;
        if (r.g_ht && !evalCell(r.g_ht, r.so, r.giaTri, r)) datHT = false;
    });
    
    if (isCHTThang) { datXS = false; datTot = false; datHT = false; }
    
    let k_t = "CHƯA HOÀN THÀNH NHIỆM VỤ";
    let k_m = "#dc3545";
    if (datXS) { k_t = "HOÀN THÀNH XUẤT SẮC NHIỆM VỤ"; k_m = "#28a745"; }
    else if (datTot) { k_t = "HOÀN THÀNH TỐT NHIỆM VỤ"; k_m = "#007bff"; }
    else if (datHT) { k_t = "HOÀN THÀNH NHIỆM VỤ"; k_m = "#fd7e14"; }
    
    let tongDiem = diemP1 + diemP2;
    diemP1 = Math.round(diemP1 * 10) / 10;
    diemP2 = Math.round(diemP2 * 10) / 10;
    tongDiem = Math.round(tongDiem * 10) / 10;
    
    console.log(`Kết quả: P1=${diemP1}, P2=${diemP2}, Tổng=${tongDiem}, Loại=${k_t}`);
    return { diemP1, diemP2, tongDiem, k_t, k_m };
};

// Đảm bảo hàm toàn cục
window.f_x_f_gv = f_x_f_gv;
window.f_x_g_gv = f_x_g_gv;
</script>
