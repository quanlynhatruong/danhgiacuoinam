<div id="module-ket-qua-ui" style="display: none; width: 100%;">
    <div class="k-header-sticky">
        <button class="n-dx" onclick="f_x_logout()">Đăng xuất</button>
        <div class="k-dau">
            <h2><span class="app-school-name-up">ĐANG TẢI...</span></h2>
            <h1>KẾT QUẢ ĐÁNH GIÁ VIÊN CHỨC</h1>
            <div style="margin-top: 10px; display: inline-flex; align-items: center; background: #e9ecef; padding: 5px 15px; border-radius: 20px;">
                <label for="locNamHoc" style="font-weight: bold; color: var(--mau-c); margin-right: 10px; font-size: 15px;">Năm học:</label>
                <select id="locNamHoc" style="padding: 5px 15px; border-radius: 15px; border: 1px solid #ced4da; font-family: inherit; font-size: 15px; color: #dc3545; font-weight: bold; outline: none; cursor: pointer;">
                    <option value="">-- Chọn năm học --</option>
                </select>
            </div>
        </div>
    </div>
    
    <div id="h-dang-tai-kq" style="text-align: center; color: var(--mau-c); font-style: italic; margin: 30px; font-size: 16px;">Đang tiến hành trích xuất và sắp xếp dữ liệu...</div>
    
    <div id="vungKetQua" style="display: none; padding: 20px;">
        <table>
            <thead>
                <tr>
                    <th width="5%">STT</th>
                    <th width="35%">Họ và tên</th>
                    <th width="20%">Phân loại</th>
                    <th width="40%">Kết quả xếp loại</th>
                </tr>
            </thead>
            <tbody id="bang-ket-qua">
            </tbody>
        </table>
    </div>
</div>

<script>
    let v_dl_toan_bo = [];

    // Hàm gọi hiển thị module kết quả từ menu
    function hienThiModuleKetQua() {
        document.getElementById("vungThuNhat").classList.add("a-di");
        document.getElementById("vungThuHai").classList.add("a-di");
        if(document.getElementById("cap-quyen-ui")) document.getElementById("cap-quyen-ui").style.display = "none";
        
        document.getElementById("module-ket-qua-ui").style.display = "block";
        document.getElementById("vungThongTin").style.display = "none";
        document.getElementById("vungThongTinKetQua").style.display = "block";

        // Cập nhật trạng thái menu
        document.getElementById("menu-danh-gia").style.backgroundColor = ""; 
        document.getElementById("menu-danh-gia").style.fontWeight = "normal";
        document.getElementById("menu-ket-qua").style.backgroundColor = "rgba(255, 255, 255, 0.15)";
        document.getElementById("menu-ket-qua").style.fontWeight = "bold";

        // Tải dữ liệu nếu chưa có
        if (v_dl_toan_bo.length === 0) taiDuLieuKetQua();
    }

    async function taiDuLieuKetQua() {
        try {
            const z_y_a = (typeof DG_CONFIG_GAS_URL !== 'undefined') ? DG_CONFIG_GAS_URL : "";
            const res = await fetch(`${z_y_a}?z_p_a=l_k_q`);
            const t_k = await res.json();
            if (t_k.status === 'success') {
                v_dl_toan_bo = t_k.d_l_k;
                napDropdownNamHoc(v_dl_toan_bo);
                document.getElementById("h-dang-tai-kq").style.display = "none";
                document.getElementById("vungKetQua").style.display = "block";
                
                const selectNam = document.getElementById("locNamHoc");
                if (selectNam) selectNam.addEventListener('change', locDuLieuTheoNam);
                
                locDuLieuTheoNam();
            } else {
                document.getElementById("h-dang-tai-kq").innerText = "Chưa có dữ liệu trên hệ thống.";
            }
        } catch (err) {
            document.getElementById("h-dang-tai-kq").innerText = "Lỗi kết nối máy chủ. Chưa tải được dữ liệu.";
        }
    }

    function napDropdownNamHoc(d_l) {
        const selectNam = document.getElementById("locNamHoc");
        if (!selectNam) return;
        selectNam.innerHTML = '<option value="">-- Chọn năm học --</option>';
        let cacNam = new Set();
        d_l.forEach(item => {
            if (item.n_hoc && item.n_hoc.trim() !== "") cacNam.add(item.n_hoc.trim());
        });
        let mangNam = Array.from(cacNam).sort().reverse();
        mangNam.forEach(nam => {
            let opt = document.createElement("option");
            opt.value = nam;
            opt.textContent = nam;
            selectNam.appendChild(opt);
        });
        if(mangNam.length > 0) {
            selectNam.value = mangNam[0];
        }
    }

    function locDuLieuTheoNam() {
        const selectObj = document.getElementById("locNamHoc");
        if (!selectObj) return;
        const namChon = selectObj.value.trim();
        const k_b = document.getElementById("bang-ket-qua");
        
        if (!namChon) {
            k_b.innerHTML = `<tr><td colspan="4" style="text-align:center; font-style: italic; color: #555;">Vui lòng chọn năm học để xem kết quả</td></tr>`;
            return;
        }
        
        let duLieuLoc = v_dl_toan_bo.filter(item => {
            let checkNam = item.n_hoc ? item.n_hoc.trim() : "";
            return checkNam === namChon;
        });
        
        hienThiBangKetQua(duLieuLoc);

        // Đồng bộ thông tin chức danh bên menu trái
        if (typeof capNhatXepLoaiMenuTrai === 'function') {
            let ten = document.getElementById("ui-ten-hien-thi") ? document.getElementById("ui-ten-hien-thi").innerText : "KHÁCH";
            capNhatXepLoaiMenuTrai(ten);
        }
    }

    function hienThiBangKetQua(d_l) {
        d_l.sort((a, b) => {
            let parseA = phanTichXepLoai(a.x_l_q || "");
            let parseB = phanTichXepLoai(b.x_l_q || "");
            if (parseA.muc !== parseB.muc) {
                return parseB.muc - parseA.muc;
            } else {
                return parseB.diem - parseA.diem;
            }
        });

        const k_b = document.getElementById("bang-ket-qua");
        let html = "";
        d_l.forEach((item, index) => {
            let colorCode = "#333";
            let rawStr = item.x_l_q ? item.x_l_q.toLowerCase() : "";
            if (rawStr.includes("xuất sắc")) colorCode = "#dc3545";
            else if (rawStr.includes("tốt")) colorCode = "#0056b3";
            
            html += `<tr>
                <td style="text-align: center; font-weight: bold;">${index + 1}</td>
                <td style="font-weight: bold; color: #1e1e1e;">${item.t_v_c || ""}</td>
                <td style="text-align: center; color: #555; font-weight: 500;">${item.p_l || ""}</td>
                <td style="color: ${colorCode}; font-weight: 500; white-space: pre-line;">${item.x_l_q || ""}</td>
            </tr>`;
        });
        if (html === "") html = `<tr><td colspan="4" style="text-align:center;">Chưa có viên chức nào nộp đánh giá trong năm học này</td></tr>`;
        k_b.innerHTML = html;
    }

    function phanTichXepLoai(chuoi) {
        let str = chuoi ? chuoi.toLowerCase() : "";
        let muc = 0;
        if (str.includes("xuất sắc")) muc = 4;
        else if (str.includes("tốt")) muc = 3;
        else if (str.includes("chưa hoàn thành")) muc = 1;
        else if (str.includes("hoàn thành")) muc = 2;
        
        let diem = 0;
        let match = str.match(/([0-9]+[.,]?[0-9]*)\s*điểm/);
        if (match) {
            diem = parseFloat(match[1].replace(',', '.'));
        }
        return { muc: muc, diem: diem };
    }

    // Hàm cập nhật menu trái từ dữ liệu kết quả
    function capNhatXepLoaiMenuTrai(tenGoi) {
        let selectNam = document.getElementById("locNamHoc");
        let namChon = selectNam ? selectNam.value : "";
        
        if (!namChon && document.getElementById("ui-nam-hoc")) {
            namChon = document.getElementById("ui-nam-hoc").innerText;
        } else if (document.getElementById("ui-nam-hoc")) {
            document.getElementById("ui-nam-hoc").innerText = namChon;
        }

        if (tenGoi === "..." || tenGoi === "KHÁCH") return;

        let xepLoai = "CHƯA ĐÁNH GIÁ";
        let phanLoai = document.getElementById("ui-phan-loai") ? document.getElementById("ui-phan-loai").innerText : "";
        let dungThu = "--"; 

        if (v_dl_toan_bo && v_dl_toan_bo.length > 0) {
            let danhSachTheoNam = v_dl_toan_bo.filter(item => {
                let checkNam = item.n_hoc ? item.n_hoc.trim() : "";
                return checkNam === namChon;
            });
            
            danhSachTheoNam.sort((a, b) => {
                let parseA = phanTichXepLoai(a.x_l_q || "");
                let parseB = phanTichXepLoai(b.x_l_q || "");
                if (parseA.muc !== parseB.muc) return parseB.muc - parseA.muc;
                return parseB.diem - parseA.diem;
            });

            let userIndex = danhSachTheoNam.findIndex(item => item.t_v_c === tenGoi);
            if (userIndex !== -1) {
                let userRecord = danhSachTheoNam[userIndex];
                xepLoai = userRecord.x_l_q || "CHƯA ĐÁNH GIÁ";
                phanLoai = userRecord.p_l || phanLoai;
                dungThu = userIndex + 1; 
            } else {
                let userAnyYear = v_dl_toan_bo.find(item => item.t_v_c === tenGoi);
                if (userAnyYear && userAnyYear.p_l) phanLoai = userAnyYear.p_l;
            }
        }
        
        if(document.getElementById("ui-xep-loai")) document.getElementById("ui-xep-loai").innerText = xepLoai;
        if(document.getElementById("ui-dung-thu")) document.getElementById("ui-dung-thu").innerText = dungThu;
        if(document.getElementById("ui-phan-loai")) document.getElementById("ui-phan-loai").innerText = phanLoai;
    }
</script>
