<script>
(function() {
    if (document.getElementById('ket-qua-ui')) return;

    const style = document.createElement('style');
    style.textContent = `
        #ket-qua-ui { display: none; margin-top: 0; background: white; padding: 0 20px 15px 20px; border-radius: 5px; box-sizing: border-box; }
        .kq-header-sticky { position: sticky; top: 77px; background: #fff; z-index: 990; padding-top: 5px; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 2px solid var(--mau-c); }
        .kq-tieu-de { color: var(--mau-c); text-transform: uppercase; text-align: center; margin: 0 0 10px; font-size: 20px; font-weight: bold; }
        .kq-loc-nam { display: flex; justify-content: flex-end; margin-bottom: 15px; align-items: center; gap: 10px; }
        .kq-loc-nam label { font-weight: bold; color: var(--mau-c); }
        .kq-loc-nam select { padding: 6px 12px; border-radius: 20px; border: 1px solid #ced4da; font-family: inherit; font-size: 14px; }
        .table-ketqua { width: 100%; border-collapse: collapse; margin-top: 0; }
        .table-ketqua th, .table-ketqua td { border: 1px solid #dee2e6; padding: 12px 10px; text-align: left; vertical-align: middle; }
        .table-ketqua th { background: #e9ecef; color: var(--mau-c); text-align: center; font-weight: bold; text-transform: uppercase; }
        .kq-dang-tai { text-align: center; color: var(--mau-c); font-style: italic; margin: 30px; }
    `;
    document.head.appendChild(style);

    const ketQuaHTML = `
        <div id="ket-qua-ui">
            <div class="kq-header-sticky">
                <h3 class="kq-tieu-de">KẾT QUẢ ĐÁNH GIÁ VIÊN CHỨC</h3>
                <div class="kq-loc-nam">
                    <label>Năm học:</label>
                    <select id="kq-locNamHoc">
                        <option value="">-- Chọn năm học --</option>
                    </select>
                </div>
            </div>
            <div id="kq-dang-tai" class="kq-dang-tai">Đang tiến hành trích xuất dữ liệu...</div>
            <div id="kq-vungBang" style="display: none;">
                <table class="table-ketqua">
                    <thead><tr><th width="5%">STT</th><th width="35%">Họ và tên</th><th width="20%">Phân loại</th><th width="40%">Kết quả xếp loại</th></tr></thead>
                    <tbody id="kq-bangKetQua"></tbody>
                </table>
            </div>
        </div>
    `;
    const mainUi = document.getElementById('main-ui');
    if (mainUi) mainUi.insertAdjacentHTML('beforeend', ketQuaHTML);

    window.kq_duLieuToanBo = [];
    window.kq_daTai = false;

    window.kq_taiDuLieu = async function() {
        const dangTai = document.getElementById("kq-dang-tai");
        const vungBang = document.getElementById("kq-vungBang");
        if (dangTai) dangTai.style.display = "block";
        if (vungBang) vungBang.style.display = "none";
        try {
            const z_y_a = (typeof DG_CONFIG_GAS_URL !== 'undefined') ? DG_CONFIG_GAS_URL : "";
            const response = await fetchAPI(z_y_a + "?z_p_a=l_k_q");
            if (response.status === 'success') {
                window.kq_duLieuToanBo = response.d_l_k || [];
                kq_napDropdownNamHoc();
                if (dangTai) dangTai.style.display = "none";
                if (vungBang) vungBang.style.display = "block";
                kq_locTheoNam();
                window.kq_daTai = true;
            } else {
                if (dangTai) dangTai.innerText = "Chưa có dữ liệu trên hệ thống.";
            }
        } catch (err) {
            if (dangTai) dangTai.innerText = "Lỗi kết nối máy chủ. Chưa tải được dữ liệu.";
        }
    };

    function kq_napDropdownNamHoc() {
        const selectNam = document.getElementById("kq-locNamHoc");
        if (!selectNam) return;
        selectNam.innerHTML = '<option value="">-- Chọn năm học --</option>';
        const cacNam = new Set();
        window.kq_duLieuToanBo.forEach(item => { if (item.n_hoc && item.n_hoc.trim()) cacNam.add(item.n_hoc.trim()); });
        Array.from(cacNam).sort().reverse().forEach(nam => {
            const opt = document.createElement("option");
            opt.value = nam;
            opt.textContent = nam;
            selectNam.appendChild(opt);
        });
        if (cacNam.size > 0) selectNam.value = Array.from(cacNam)[0];
        selectNam.onchange = () => kq_locTheoNam();
    }

    window.kq_locTheoNam = function() {
        const selectNam = document.getElementById("kq-locNamHoc");
        const namChon = selectNam ? selectNam.value.trim() : "";
        const tbody = document.getElementById("kq-bangKetQua");
        if (!tbody) return;
        if (!namChon) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Vui lòng chọn năm học</td></tr>';
            return;
        }
        let duLieuLoc = window.kq_duLieuToanBo.filter(item => (item.n_hoc || "").trim() === namChon);
        duLieuLoc.sort((a,b) => {
            const parse = (str) => {
                let s = (str || "").toLowerCase();
                let muc = s.includes("xuất sắc") ? 4 : s.includes("tốt") ? 3 : s.includes("hoàn thành") ? 2 : 1;
                let diem = 0;
                let match = s.match(/([0-9]+[.,]?[0-9]*)\s*điểm/);
                if (match) diem = parseFloat(match[1].replace(',','.'));
                return { muc, diem };
            };
            let pa = parse(a.x_l_q), pb = parse(b.x_l_q);
            if (pa.muc !== pb.muc) return pb.muc - pa.muc;
            return pb.diem - pa.diem;
        });
        let html = "";
        duLieuLoc.forEach((item, idx) => {
            let color = "#333";
            let raw = (item.x_l_q || "").toLowerCase();
            if (raw.includes("xuất sắc")) color = "#dc3545";
            else if (raw.includes("tốt")) color = "#0056b3";
            html += `<tr><td style="text-align:center;">${idx+1}</td><td>${item.t_v_c || ""}</td><td style="text-align:center;">${item.p_l || ""}</td><td style="color:${color};">${item.x_l_q || ""}</td></tr>`;
        });
        if (!html) html = '<tr><td colspan="4" style="text-align:center;">Chưa có viên chức nào nộp đánh giá trong năm học này</td></tr>';
        tbody.innerHTML = html;

        const tenHienThi = document.getElementById("ui-ten-hien-thi")?.innerText;
        if (tenHienThi && tenHienThi !== "..." && tenHienThi !== "KHÁCH") {
            const userRecord = duLieuLoc.find(item => item.t_v_c === tenHienThi);
            if (userRecord) {
                const viTri = duLieuLoc.findIndex(item => item.t_v_c === tenHienThi) + 1;
                document.getElementById("ui-xep-loai").innerText = userRecord.x_l_q || "CHƯA ĐÁNH GIÁ";
                document.getElementById("ui-dung-thu").innerText = viTri || "--";
                document.getElementById("ui-phan-loai").innerText = userRecord.p_l || document.getElementById("ui-phan-loai").innerText;
            }
        }
    };

    window.kq_khoiTao = function() {
        if (!window.kq_daTai) kq_taiDuLieu();
        else kq_locTheoNam();
    };
})();
</script>
